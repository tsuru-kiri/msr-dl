name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer without a v prefix (for example, 1.2.3)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must be dispatched from the main branch." >&2
          exit 1

      - name: Check out main with tags
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Validate release request
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python .github/scripts/release.py validate-version "$VERSION"
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists." >&2
            exit 1
          fi

      - name: Generate release notes
        env:
          CHANGELOG_PATH: ${{ runner.temp }}/release-notes.md
          REPOSITORY: ${{ github.repository }}
        run: |
          python .github/scripts/release.py changelog \
            --head "$(git rev-parse HEAD)" \
            --repository "$REPOSITORY" \
            --output "$CHANGELOG_PATH"

      - name: Update package version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          uv version "$VERSION" --no-sync
          python .github/scripts/release.py sync-package-version "$VERSION"
          uv lock --check

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install development dependencies
        run: uv sync --locked --extra dev

      - name: Verify release source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          uv run pytest -q
          uv run ruff check .
          uv run ruff format --check .
          test "$(uv run msr-dl --version)" = "msr-dl $VERSION"
          git diff --check

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          overwrite: true

      - name: Commit and tag release
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tag="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pyproject.toml uv.lock monster_siren/__init__.py
          git commit -m "chore: release $tag"
          git tag --annotate "$tag" --message "Release $tag"
          git push --atomic origin HEAD:main "refs/tags/$tag"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  package:
    name: Build Python package
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Build wheel and source distribution
        run: uv build --out-dir release-assets

      - name: Smoke-test wheel
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          uv venv "${{ runner.temp }}/package-smoke"
          uv pip install --python "${{ runner.temp }}/package-smoke/bin/python" release-assets/*.whl
          test "$("${{ runner.temp }}/package-smoke/bin/msr-dl" --version)" = "msr-dl $VERSION"

      - name: Upload Python package
        uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: release-assets/*
          if-no-files-found: error

  executable:
    name: Build executable (${{ matrix.target }})
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux
          - runner: macos-latest
            target: macos
          - runner: windows-latest
            target: windows
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install build dependencies
        run: uv sync --locked --extra build

      - name: Build executable
        run: uv run pyinstaller --clean --noconfirm msr-dl.spec

      - name: Verify and package executable
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test "$(./dist/msr-dl --version)" = "msr-dl $VERSION"
          mkdir -p release-assets
          tar -C dist -czf "release-assets/msr-dl-v$VERSION-$TARGET-$RUNNER_ARCH.tar.gz" msr-dl

      - name: Verify and package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $actual = & .\dist\msr-dl.exe --version
          if ($actual -ne "msr-dl $env:VERSION") {
            throw "Unexpected executable version: $actual"
          }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $archive = "release-assets/msr-dl-v$env:VERSION-$env:TARGET-$env:RUNNER_ARCH.zip"
          Compress-Archive -Path .\dist\msr-dl.exe -DestinationPath $archive

      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: executable-${{ matrix.target }}-${{ runner.arch }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - package
      - executable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mapfile -d '' assets < <(
            find release-assets -type f ! -name release-notes.md -print0
          )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file release-assets/release-notes.md \
            --verify-tag

  container:
    name: Publish container image
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.tag }}
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.release_sha }}

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
