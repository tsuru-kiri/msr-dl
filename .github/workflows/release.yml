name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer without a v prefix (for example, 1.2.3)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases must be dispatched from the main branch." >&2
          exit 1

      - name: Check out main with tags
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Validate release request
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python .github/scripts/release.py validate-version "$VERSION"
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists." >&2
            exit 1
          fi

      - name: Generate release notes
        env:
          CHANGELOG_PATH: ${{ runner.temp }}/release-notes.md
          REPOSITORY: ${{ github.repository }}
        run: |
          python .github/scripts/release.py changelog \
            --head "$(git rev-parse HEAD)" \
            --repository "$REPOSITORY" \
            --output "$CHANGELOG_PATH"

      - name: Update package version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          uv version "$VERSION" --no-sync
          python .github/scripts/release.py sync-package-version "$VERSION"
          uv lock --check

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install development dependencies
        run: uv sync --locked --extra dev

      - name: Verify release source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          uv run pytest -q
          uv run ruff check .
          uv run ruff format --check .
          test "$(uv run msr-dl --version)" = "msr-dl $VERSION"
          git diff --check

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          overwrite: true

      - name: Commit and tag release
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tag="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pyproject.toml uv.lock monster_siren/__init__.py
          git commit -m "chore: release $tag"
          git tag --annotate "$tag" --message "Release $tag"
          git push --atomic origin HEAD:main "refs/tags/$tag"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  package:
    name: Build Python package
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Build wheel and source distribution
        run: |
          uv build --out-dir release-assets
          cp install.ps1 release-assets/install.ps1
          cp install.sh release-assets/install.sh

      - name: Smoke-test wheel
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          uv venv "${{ runner.temp }}/package-smoke"
          uv pip install --python "${{ runner.temp }}/package-smoke/bin/python" release-assets/*.whl
          test "$("${{ runner.temp }}/package-smoke/bin/msr-dl" --version)" = "msr-dl $VERSION"

      - name: Upload Python package
        uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - prepare
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mapfile -d '' assets < <(
            find release-assets -type f ! -name release-notes.md -print0
          )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file release-assets/release-notes.md \
            --verify-tag

  windows-installer:
    name: Verify Windows installer
    needs:
      - prepare
      - publish
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Install and verify twice
        shell: powershell
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $existingFfmpeg = Get-Command ffmpeg.exe -ErrorAction SilentlyContinue
          if ($null -ne $existingFfmpeg) {
            $ffmpegDirectory = Split-Path -Parent $existingFfmpeg.Source
            $env:Path = (@($env:Path -split ';') | Where-Object {
              $_.TrimEnd('\') -ine $ffmpegDirectory.TrimEnd('\')
            }) -join ';'
          }

          irm https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/install.ps1 | iex
          irm https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/install.ps1 | iex

          $uv = (Get-Command uv.exe).Source
          $toolBin = (& $uv tool dir --bin).Trim()
          $actual = & (Join-Path $toolBin "msr-dl.exe") --version
          if ($actual -ne "msr-dl $env:VERSION") {
            throw "Unexpected msr-dl version: $actual"
          }

          $ffmpeg = Join-Path $env:LOCALAPPDATA "msr-dl\ffmpeg\bin\ffmpeg.exe"
          if (-not (Test-Path -LiteralPath $ffmpeg -PathType Leaf)) {
            throw "Managed FFmpeg was not installed."
          }
          $ffmpegRoot = Split-Path -Parent (Split-Path -Parent $ffmpeg)
          if (-not (Test-Path -LiteralPath (Join-Path $ffmpegRoot "FFMPEG-NOTICE.txt") -PathType Leaf)) {
            throw "Managed FFmpeg notice was not installed."
          }
          $ffmpegOutput = & $ffmpeg -version
          $ffmpegExitCode = $LASTEXITCODE
          $ffmpegOutput | Select-Object -First 1
          if ($ffmpegExitCode -ne 0) {
            throw "Managed FFmpeg verification failed."
          }

  posix-installer:
    name: Verify installer (${{ matrix.runner }})
    needs:
      - prepare
      - publish
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Install and verify twice
        env:
          MSR_DL_INSTALL_FORCE_FFMPEG: "1"
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          curl -LsSf "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh" | sh

          case "$(uname -s)" in
            Darwin) ffmpeg="$HOME/Library/Application Support/msr-dl/ffmpeg/bin/ffmpeg" ;;
            Linux) ffmpeg="${XDG_DATA_HOME:-$HOME/.local/share}/msr-dl/ffmpeg/bin/ffmpeg" ;;
          esac
          test -x "$ffmpeg"
          test -f "$(dirname "$(dirname "$ffmpeg")")/FFMPEG-NOTICE.txt"
          first_modified=$(stat -f %m "$ffmpeg" 2>/dev/null || stat -c %Y "$ffmpeg")

          sleep 1
          curl -LsSf "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh" | sh

          uv_bin=$(command -v uv || printf '%s' "$HOME/.local/bin/uv")
          tool_bin=$("$uv_bin" tool dir --bin)
          test "$("$tool_bin/msr-dl" --version)" = "msr-dl $VERSION"
          test "$(stat -f %m "$ffmpeg" 2>/dev/null || stat -c %Y "$ffmpeg")" = "$first_modified"
          "$ffmpeg" -version | sed -n '1p'

  container:
    name: Publish container image
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.tag }}
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.release_sha }}

      - name: Build and push container image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  homebrew:
    name: Update Homebrew formula
    needs:
      - prepare
      - publish
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          path: msr-dl

      - name: Check out Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: tsuru-kiri/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap

      - name: Register Homebrew tap
        run: |
          tap_root="$(brew --repository)/Library/Taps/tsuru-kiri"
          mkdir -p "$tap_root"
          ln -s "$GITHUB_WORKSPACE/homebrew-tap" "$tap_root/homebrew-tap"

      - name: Download Python package
        uses: actions/download-artifact@v8
        with:
          name: python-package
          path: release-assets

      - name: Update formula
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python msr-dl/.github/scripts/release.py homebrew-formula \
            --version "$VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --assets release-assets \
            --output homebrew-tap/Formula/msr-dl.rb
          brew update-python-resources tsuru-kiri/tap/msr-dl

      - name: Test formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew install tsuru-kiri/tap/msr-dl
          brew test tsuru-kiri/tap/msr-dl

      - name: Commit formula
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        working-directory: homebrew-tap
        run: |
          if git diff --quiet -- Formula/msr-dl.rb; then
            echo "Formula is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Formula/msr-dl.rb
          git commit -m "msr-dl v$VERSION"
          git push origin HEAD:main
