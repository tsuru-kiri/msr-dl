[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "msr-dl"
version = "0.1.2"
description = "Download Monster Siren albums with metadata and synchronized lyrics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "requests>=2.32,<3",
    "urllib3>=2,<3",
    "mutagen>=1.47,<2",
    "pylrc>=0.1.2,<0.2",
    "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
msr-dl = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["monster_siren*"]

[tool.setuptools.package-data]
monster_siren = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
